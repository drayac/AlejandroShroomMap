# Alejandro Shroom Map - standalone nginx site, isolated from any other site on the box.
# Install as /etc/nginx/sites-available/alejandroshroommap, symlink into
# sites-enabled, then get a certificate (certbot rewrites this file in place to
# add the 443/TLS block and an http->https redirect):
#   certbot --nginx -d shroommap.217-154-218-125.sslip.io --redirect
#
# The hostname below follows the sslip.io pattern of the other apps; change it for a real domain. HTTPS is required,
# not optional: browsers block navigator.geolocation on plain http:// for any
# non-localhost origin, which would break "use my location" and the GPS pin.
#
# `root` is a copy of frontend/ in a place the nginx worker can read (see the
# README's deploy steps) - not the git checkout itself.

server {
    server_name shroommap.217-154-218-125.sslip.io;

    root /var/www/html/alejandroshroommap/frontend;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    client_max_body_size 20m;

    location / {
        try_files $uri $uri/ /index.html;
        # No build step or hashed filenames - always revalidate the app files so
        # a deploy is visible on the next reload instead of sitting in the
        # browser's disk cache.
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8012/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The identify call waits on location lookups + Gemini; give it room.
        proxy_read_timeout 90s;
    }

    # Uploaded photos live in a named docker volume (not readable by the nginx
    # worker), so they are served through the backend rather than an alias.
    location /uploads/ {
        proxy_pass http://127.0.0.1:8012/uploads/;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    listen 80;
    listen [::]:80;
}
